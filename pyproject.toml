[project]
name = "piifilter"
version = "0.1.0"
description = "On-device PII filter for LLM prompts: detect, mask, call the LLM, unmask (CSED490E term project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gliner>=0.2.29",
    "torch>=2.6",
    "transformers>=4.51.3",
    "accelerate>=1.0",
    "openai>=2.0",
    "anthropic>=1.0",
    "protobuf>=7.36.2",
    "python-dotenv>=1.2.4",
    "presidio-analyzer>=2.2.366",
    "pandas>=3.1.0",
    "numpy>=2.4.6",
    "pyarrow>=26.0.0",
    "huggingface-hub>=1.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["PIIFilter", "baselines", "benchmark"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
